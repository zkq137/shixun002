server:
  port: 8084

spring:
  application:
    name: talent-promotion-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
        group: DEFAULT_GROUP
    sentinel:
      transport:
        # Sentinel 控制台地址（默认本机 8858，启动方式见 README 第八节）
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
        # 本服务与控制台通信的端口，同机多服务必须互不相同
        # 注意：Sentinel 控制台自己会占用默认的 8719，所以从 8720 开始编号
        port: 8723
        # 本机装了 VMware / Radmin VPN 等多张虚拟网卡时，Sentinel 自动探测的 IP 可能是 26.x 之类，
        # 控制台就连不上、看不到实时监控。本机开发统一注册成 127.0.0.1。
        client-ip: ${SENTINEL_CLIENT_IP:127.0.0.1}
      # 启动即注册到控制台，不用等第一次访问
      eager: true
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active:dev}.yaml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/talent_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 20050312
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.talent: debug
