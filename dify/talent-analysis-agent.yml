        isInIteration: false
        sourceType: llm
        targetType: code
      id: planner-source-parse-target
      source: planner
      sourceHandle: source
      target: parse
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: if-else
      id: parse-source-if_get-target
      source: parse
      sourceHandle: source
      target: if_get
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: if-else
        targetType: http-request
      id: if_get-true-http_get-target
      source: if_get
      sourceHandle: 'true'
      target: http_get
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
