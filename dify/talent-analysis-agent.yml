app:
  description: 人才梯队健康度、流动趋势、自定义报表与模型效果分析
  icon: 📊
  icon_background: '#EAF4FF'
  mode: advanced-chat
  name: 数据分析与报告智能体
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables:
  - name: base_url
    value: http://host.docker.internal:9090
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .xlsx
      - .xls
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      number_limits: 1
    opening_statement: 你好，我是人才数据分析助手。可以分析梯队健康度、人才流动趋势、生成自定义报表、查看模型效果并追溯训练日志。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 分析当前人才梯队健康度
    - 查看人才流动趋势和主要风险
    - 按部门生成人数和平均绩效报表
    - 查看模型运行效果最好的版本
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: start-source-planner-target
      source: start
      sourceHandle: source
      target: planner
      targetHandle: target
      type: custom
      zIndex: 0
