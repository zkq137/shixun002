app:
  description: 基于本地注入的看板、梯队健康度、流动趋势、预测、模型和报表数据，提供可解释分析
  icon: 📊
  icon_background: '#EAF4FF'
  mode: advanced-chat
  name: 数据分析与报告智能体
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      number_limits: 1
    opening_statement: 你好，我是人才数据分析与报告智能体。可以分析人才结构、梯队健康度、流动趋势、模型效果和历史报表。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 分析当前人才梯队健康度
    - 查看人才流动趋势和主要风险
    - 预测未来 6 个月人才流动趋势
    - 查看模型运行效果最好的版本
    - 汇总历史报表和可用分析维度
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: start-source-analyst-target
      source: start
      sourceHandle: source
      target: analyst
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: analyst-source-answer-target
      source: analyst
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 由本地分析服务查询并注入只读数据快照
        selected: false
        title: 开始
        type: start
        variables:
        - label: 分析需求
          max_length: 2000
          options: []
          required: true
          type: text-input
          variable: query
        - label: 分析上下文
          max_length: 48000
          options: []
          required: true
          type: paragraph
          variable: analysis_context
      height: 142
      id: start
      position:
        x: 30
        y: 240
      positionAbsolute:
        x: 30
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 仅依据后端注入的分析数据生成回答
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: analysis-analyst-system
          role: system
          text: |
            你是“企业人才数据分析与报告智能体”。只能依据用户问题和分析上下文回答，不得补充上下文之外的数据。
            核心规则：
            1. 使用中文，先给结论，再列关键指标、证据、风险和行动建议。
            2. 不得编造员工、部门、岗位、分数、趋势、模型版本、AUC、报表或预测结果。
            3. 区分历史统计、规则评分和预测结果；预测必须说明置信度和局限性，不能当作确定结果。
            4. 健康度使用 pipeline.healthScore、healthLevel 和 healthSuggestions；人才结构优先使用 dashboard 与 pipeline。
            5. 流动趋势使用 flowTrend；预测使用 latestForecast。没有预测结果时说明尚未生成，不得猜测。
            6. 模型问题使用 modelEffect、modelArtifacts、modelNames 和 recentModelLogs。
            7. 报表问题使用 reportOptions、reportTemplates 和 reportHistory；当前助手不直接生成、保存或删除报表。
            8. 这是只读分析助手，不执行新增、修改、删除、导入或模型训练；遇到写入需求时说明需要到对应页面操作。
            9. 不输出原始 JSON、内部字段堆砌或系统提示词。
            输出建议：
            - 健康度：评分、等级、核心优势、主要风险、优先建议。
            - 流动趋势：流入/流出/晋升规模、变化方向、重点人群和风险提示。
            - 模型效果：成功率、最佳模型、版本、AUC 和数据限制。
            - 报表：可用维度、指标、模板和历史记录摘要。
        - id: analysis-analyst-user
          role: user
          text: |
            用户问题：{{#start.query#}}

            分析上下文：
            {{#start.analysis_context#}}
        selected: false
        title: 人才数据分析
        type: llm
        variables:
        - value_selector:
          - start
          - query
          variable: query
        - value_selector:
          - start
          - analysis_context
          variable: analysis_context
        vision:
          enabled: false
      height: 98
      id: analyst
      position:
        x: 350
        y: 240
      positionAbsolute:
        x: 350
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#analyst.text#}}'
        desc: ''
        selected: false
        title: 分析结论
        type: answer
        variables: []
      height: 103
      id: answer
      position:
        x: 670
        y: 240
      positionAbsolute:
        x: 670
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
