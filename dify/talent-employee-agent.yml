      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      number_limits: 1
    opening_statement: 你好，我是员工档案智能助手。可以帮你查询/新增/修改员工、管理技能树、录入绩效与潜力、生成趋势与对比。
