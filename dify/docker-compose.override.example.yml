# 适用于 Windows 上通过 Docker 运行 Dify 的开发环境。
# 将本文件复制到 Dify 的 docker 目录，并命名为 docker-compose.override.yml。
# 使用 Docker 动态解析当前主机网关，避免绑定到某台电脑的固定 IP。
services:
  api:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  api_websocket:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ssrf_proxy:
    extra_hosts:
      - "host.docker.internal:host-gateway"
